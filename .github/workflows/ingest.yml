name: Hourly ingest

# Vercel Hobby cron runs once a day. This workflow calls the same /api/ingest
# endpoint every hour so the archive keeps hourly history for free.
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   APP_URL      e.g. https://hazewatch-drab.vercel.app  (no trailing slash)
#   CRON_SECRET  the same value as the CRON_SECRET env var on Vercel

on:
  schedule:
    # Scheduled runs can be delayed by a few minutes at busy times.
    - cron: "15 * * * *"
  workflow_dispatch:

concurrency:
  group: hazewatch-ingest
  cancel-in-progress: false

permissions: {}

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call /api/ingest
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL and CRON_SECRET repository secrets are required." >&2
            exit 1
          fi
          status=$(curl --silent --show-error --max-time 240 \
            --retry 2 --retry-delay 10 \
            --output response.json --write-out "%{http_code}" \
            --request POST "${APP_URL%/}/api/ingest" \
            --header "Authorization: Bearer ${CRON_SECRET}")
          echo "HTTP ${status}"
          cat response.json
          echo
          [ "$status" -ge 200 ] && [ "$status" -lt 300 ]
